; TaskPal for M5Paper V1.1. See README.md
[platformio]
default_envs = m5paper
; fonts.ini is generated by tools/gen_vlw.py (list of embedded VLW fonts, D15)
extra_configs = fonts.ini

; Shared by every device environment (extends = esp32).
[esp32]
; pioarduino, Arduino-ESP32 3.3.8 (same core as the Arduino IDE m5stack core 3.3.8)
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
framework = arduino
board = m5paper
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.embed_files = ${fonts.embed}
upload_port = COM3
upload_speed = 460800
monitor_port = COM3
monitor_speed = 115200
; M5Paper resets if the monitor toggles DTR/RTS (boards.txt: serial.disableDTR/RTS=true)
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp32_exception_decoder
lib_deps =
  m5stack/M5Unified@0.2.18
  m5stack/M5GFX@0.2.30   ; 0.2.25 (Arduino IDE copy) isn't in the PIO registry
  bblanchon/ArduinoJson@7.4.3
build_flags =
  -DCORE_DEBUG_LEVEL=3
  -std=gnu++17

[env:m5paper]
extends = esp32
test_framework = unity
build_src_filter = +<*> -<spikes/>

; Host unit tests for src/core (Unity). Needs a host gcc:
;   pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = +<core/>
lib_deps =
  bblanchon/ArduinoJson@7.4.3
build_flags =
  -std=gnu++17
  -Wall
  -Wextra

; Early hardware test sketches (not shipped)
[env:spike_display]
extends = esp32
build_src_filter = +<spikes/display/> +<ui/icons_data.cpp>

[env:spike_sleep]
extends = esp32
build_src_filter = +<spikes/sleep/>
